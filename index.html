<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Super Pixel Bro</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: linear-gradient(#5c94fc, #9fd0ff);
    font-family: 'Trebuchet MS', Arial, sans-serif;
  }
  h1 {
    color: #fff;
    text-shadow: 2px 2px 0 #b02a2a, 4px 4px 0 rgba(0,0,0,0.2);
    margin-bottom: 10px;
    letter-spacing: 2px;
  }
  #gameWrap {
    position: relative;
    border: 6px solid #3a3a3a;
    border-radius: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  canvas {
    display: block;
    background: #5c94fc;
  }
  #hud {
    position: absolute;
    top: 10px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    color: #fff;
    font-weight: bold;
    font-size: 18px;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.4);
    pointer-events: none;
  }
  #overlay {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    text-align: center;
  }
  #overlay h2 {
    font-size: 32px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 0 #000;
  }
  #overlay p { margin-bottom: 16px; font-size: 16px; }
  #overlay button {
    padding: 10px 24px;
    font-size: 16px;
    font-weight: bold;
    background: #e52521;
    color: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    box-shadow: 0 4px 0 #a11a17;
  }
  #overlay button:active { box-shadow: 0 1px 0 #a11a17; transform: translateY(3px); }
  #instructions {
    margin-top: 12px;
    color: #fff;
    font-size: 14px;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.4);
  }
</style>
</head>
<body>

<h1>SUPER PIXEL BRO</h1>

<div id="gameWrap">
  <canvas id="game" width="800" height="400"></canvas>
  <div id="hud">
    <div id="score">Score: 0</div>
    <div id="lives">Lives: 3</div>
  </div>
  <div id="overlay">
    <h2 id="overlayTitle">Game Over</h2>
    <p id="overlayMsg">Final Score: 0</p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<p id="instructions">← → to move · Space / ↑ to jump · Stomp enemies, grab coins, reach the flag!</p>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const GRAVITY = 0.6;
  const GROUND_Y = H - 48;

  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayMsg = document.getElementById('overlayMsg');
  const restartBtn = document.getElementById('restartBtn');

  let keys = {};
  document.addEventListener('keydown', e => {
    keys[e.code] = true;
    if (['Space','ArrowUp','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
  });
  document.addEventListener('keyup', e => keys[e.code] = false);

  let camX, player, coins, enemies, platforms, flag, score, lives, gameOver, won, levelWidth;

  function initLevel() {
    camX = 0;
    score = 0;
    lives = 3;
    gameOver = false;
    won = false;
    levelWidth = 2400;

    player = { x: 50, y: GROUND_Y - 40, w: 28, h: 40, vx: 0, vy: 0, onGround: false, facing: 1, invuln: 0 };

    platforms = [
      { x: 0, y: GROUND_Y, w: levelWidth, h: 48 },
      { x: 300, y: GROUND_Y - 90, w: 120, h: 20 },
      { x: 520, y: GROUND_Y - 150, w: 100, h: 20 },
      { x: 760, y: GROUND_Y - 90, w: 140, h: 20 },
      { x: 1050, y: GROUND_Y - 60, w: 100, h: 20 },
      { x: 1300, y: GROUND_Y - 130, w: 120, h: 20 },
      { x: 1550, y: GROUND_Y - 70, w: 100, h: 20 },
      { x: 1800, y: GROUND_Y - 140, w: 140, h: 20 },
      { x: 2050, y: GROUND_Y - 90, w: 120, h: 20 },
    ];

    coins = [];
    [ [340,GROUND_Y-130], [560,GROUND_Y-190], [800,GROUND_Y-130],
      [1080,GROUND_Y-100], [1330,GROUND_Y-170], [1580,GROUND_Y-110],
      [1830,GROUND_Y-180], [2080,GROUND_Y-130], [430,GROUND_Y-40],
      [900,GROUND_Y-40], [1450,GROUND_Y-40], [1950,GROUND_Y-40]
    ].forEach(([x,y]) => coins.push({ x, y, w: 18, h: 18, taken: false }));

    enemies = [];
    [ [450, 1, 400, 550], [900, -1, 850, 1050], [1350, 1, 1300, 1500],
      [1750, -1, 1700, 1950], [2150, 1, 2100, 2300]
    ].forEach(([x,dir,minX,maxX]) => enemies.push({
      x, y: GROUND_Y - 28, w: 28, h: 28, vx: 1.4 * dir, minX, maxX, alive: true
    }));

    flag = { x: levelWidth - 60, y: GROUND_Y - 200, w: 12, h: 200 };

    overlay.style.display = 'none';
    updateHUD();
  }

  function updateHUD() {
    scoreEl.textContent = 'Score: ' + score;
    livesEl.textContent = 'Lives: ' + lives;
  }

  function rectsOverlap(a, b) {
    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
  }

  function endGame(didWin) {
    gameOver = true;
    won = didWin;
    overlayTitle.textContent = didWin ? 'You Win!' : 'Game Over';
    overlayMsg.textContent = 'Final Score: ' + score;
    overlay.style.display = 'flex';
  }

  function update() {
    if (gameOver) return;

    // horizontal movement
    if (keys['ArrowLeft']) { player.vx = -4; player.facing = -1; }
    else if (keys['ArrowRight']) { player.vx = 4; player.facing = 1; }
    else { player.vx *= 0.7; }

    // jump
    if ((keys['Space'] || keys['ArrowUp']) && player.onGround) {
      player.vy = -12.5;
      player.onGround = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;
    player.y += player.vy;

    if (player.x < 0) player.x = 0;
    if (player.x + player.w > levelWidth) player.x = levelWidth - player.w;

    player.onGround = false;
    for (const p of platforms) {
      if (player.x + player.w > p.x && player.x < p.x + p.w &&
          player.y + player.h > p.y && player.y + player.h - player.vy <= p.y + 1 &&
          player.vy >= 0) {
        player.y = p.y - player.h;
        player.vy = 0;
        player.onGround = true;
      }
    }

    if (player.y > H) {
      loseLife();
    }

    // enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      e.x += e.vx;
      if (e.x < e.minX || e.x + e.w > e.maxX) e.vx *= -1;

      if (rectsOverlap(player, e)) {
        if (player.vy > 2 && player.y + player.h - player.vy <= e.y + 6) {
          e.alive = false;
          player.vy = -8;
          score += 100;
          updateHUD();
        } else if (player.invuln <= 0) {
          loseLife();
        }
      }
    }
    if (player.invuln > 0) player.invuln--;

    // coins
    for (const c of coins) {
      if (!c.taken && rectsOverlap(player, c)) {
        c.taken = true;
        score += 25;
        updateHUD();
      }
    }

    // flag / win
    if (rectsOverlap(player, flag)) {
      endGame(true);
    }

    // camera
    camX = Math.max(0, Math.min(player.x - W / 2, levelWidth - W));
  }

  function loseLife() {
    lives--;
    updateHUD();
    if (lives <= 0) {
      endGame(false);
    } else {
      player.x = Math.max(0, camX + 50);
      player.y = GROUND_Y - 40;
      player.vx = 0;
      player.vy = 0;
      player.invuln = 60;
    }
  }

  function drawBackground() {
    ctx.fillStyle = '#5c94fc';
    ctx.fillRect(0, 0, W, H);
    // clouds
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    for (let i = 0; i < 6; i++) {
      const cx = (i * 400 - camX * 0.3) % (levelWidth + 400);
      drawCloud(cx, 50 + (i % 3) * 20);
    }
    // hills
    ctx.fillStyle = '#3fae3f';
    for (let i = 0; i < 8; i++) {
      const hx = (i * 300 - camX * 0.6) % (levelWidth + 300);
      ctx.beginPath();
      ctx.arc(hx, GROUND_Y + 20, 60, Math.PI, 0);
      ctx.fill();
    }
  }

  function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 16, 0, Math.PI * 2);
    ctx.arc(x + 18, y - 8, 18, 0, Math.PI * 2);
    ctx.arc(x + 36, y, 16, 0, Math.PI * 2);
    ctx.fill();
  }

  function draw() {
    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);

    // platforms
    for (const p of platforms) {
      ctx.fillStyle = '#8b5a2b';
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = '#3fae3f';
      ctx.fillRect(p.x, p.y, p.w, 10);
    }

    // coins
    for (const c of coins) {
      if (c.taken) continue;
      ctx.fillStyle = '#ffd23f';
      ctx.beginPath();
      ctx.arc(c.x + c.w / 2, c.y + c.h / 2, c.w / 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#c99a1e';
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // flag
    ctx.fillStyle = '#888';
    ctx.fillRect(flag.x, flag.y, 6, flag.h);
    ctx.fillStyle = '#2ecc71';
    ctx.beginPath();
    ctx.moveTo(flag.x + 6, flag.y);
    ctx.lineTo(flag.x + 40, flag.y + 15);
    ctx.lineTo(flag.x + 6, flag.y + 30);
    ctx.closePath();
    ctx.fill();

    // enemies
    for (const e of enemies) {
      if (!e.alive) continue;
      ctx.fillStyle = '#8b4513';
      ctx.fillRect(e.x, e.y, e.w, e.h);
      ctx.fillStyle = '#000';
      ctx.fillRect(e.x + 5, e.y + 8, 5, 5);
      ctx.fillRect(e.x + e.w - 10, e.y + 8, 5, 5);
      ctx.fillStyle = '#fff';
      ctx.fillRect(e.x + 2, e.y + e.h - 6, 8, 6);
      ctx.fillRect(e.x + e.w - 10, e.y + e.h - 6, 8, 6);
    }

    // player
    if (!(player.invuln > 0 && Math.floor(player.invuln / 4) % 2 === 0)) {
      ctx.fillStyle = '#e52521';
      ctx.fillRect(player.x, player.y, player.w, player.h * 0.5);
      ctx.fillStyle = '#3355dd';
      ctx.fillRect(player.x, player.y + player.h * 0.5, player.w, player.h * 0.5);
      ctx.fillStyle = '#ffcc99';
      ctx.fillRect(player.x + (player.facing > 0 ? 14 : -2), player.y + 6, 16, 12);
    }

    ctx.restore();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  restartBtn.addEventListener('click', initLevel);

  initLevel();
  loop();
})();
</script>
</body>
</html>
